# Container 1: liefert die Website aus und leitet /api/ an Container 2 weiter.
server {
    listen 80;
    server_name _;

    # Keine nginx-Version in Antworten und Fehlerseiten
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Obergrenze für eine ganze Anfrage. Die Entwicklerseite schickt nur
    # kleine JSON-Bodies (Board-Karten). Größere lehnt nginx ab, bevor sie
    # Container 2 erreichen, und antwortet mit JSON statt einer HTML-Seite.
    client_max_body_size 1m;
    error_page 413 = @too_large;

    # Docker-DNS: Container 2 wird bei jeder Anfrage neu nachgeschlagen, damit
    # ein Neustart von Container 2 (neue IP) nginx nicht aus dem Tritt bringt.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location / {
        include /etc/nginx/security_headers.conf;
        # Immer beim Server nachfragen, damit nach einem Update nicht die alte
        # Website im Browser hängt
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store" always;

        proxy_pass $api;
        proxy_http_version 1.1;
        # Integritätsprüfung und Git-Statistik können ein paar Sekunden dauern
        proxy_read_timeout 120s;
    }

    location @too_large {
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 413 '{"error":"too_large"}';
    }
}
