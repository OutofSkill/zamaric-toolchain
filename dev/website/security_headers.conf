# Sicherheits-Header für jede Antwort, siehe README → Entwicklerseite.
# Steht in einer eigenen Datei, weil nginx add_header aus dem server-Block
# nicht mehr erbt, sobald eine location eigene add_header hat.
# img-src erlaubt data:, damit Bilder im gerenderten Markdown (README, Karten)
# nur als eingebettete Daten, nie von fremden Servern geladen werden.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
