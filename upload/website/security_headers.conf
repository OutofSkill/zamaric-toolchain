# Sicherheits-Header für jede Antwort, siehe README → Sicherheit.
# Steht in einer eigenen Datei, weil nginx add_header aus dem server-Block
# nicht mehr erbt, sobald eine location eigene add_header hat.
add_header Content-Security-Policy "default-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
